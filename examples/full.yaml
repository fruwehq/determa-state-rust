# A self-contained format 1 bundle demonstrating:
# - public input/output contracts and correlation;
# - source-context transition actions;
# - host-supplied input and external variables;
# - explicit deep-history resume, self-history lifecycle replay, and plain-path restart;
# - isolated lifecycle-bound components;
# - owned spawn with a nominal instance reference; and
# - an external scheduling request rather than a core timer.
format: 1
namespace: example.orders

events:
  submit:
    direction: input
  finish_components:
    direction: input
  cancel_worker:
    direction: input
  begin:
    direction: internal
  finish_component:
    direction: internal
  payment_requested:
    direction: output
    payload:
      order_id: { type: string, required: true }
  payment_succeeded:
    direction: input
    correlates_to: payment_requested
    payload:
      provider_id: { type: string, required: true }
  payment_rejected:
    direction: input
    correlates_to: payment_requested
    payload:
      reason: { type: string, required: true }
  reminder_requested:
    direction: output
    payload:
      order_id: { type: string, required: true }
      delay_seconds: { type: int, required: true }
  reminder_elapsed:
    direction: input
    correlates_to: reminder_requested

machines:
  - machine_id: order
    version: 1
    root:
      type: composite
      variables:
        order_id: { type: string, input: true }
        provider_region: { type: string, external: true }
        payment_status: { type: string, init: pending }
        reminder_due: { type: bool, init: false }
        payment_worker:
          type: instance_reference
          machine_id: payment_worker
          nullable: true
          init: null
      initial: { transition_to: idle }
      on_events:
        env:
          action:
            - refresh: { only: [provider_region] }
      states:
        idle:
          on_events:
            submit:
              transition_to: processing
              action:
                - spawn:
                    machine_id: payment_worker
                    bindings:
                      input:
                        order_id: "order_id"
                      external:
                        provider_region: "provider_region"
                    bind_to: payment_worker
                - send:
                    event: payment_requested
                    to: { external: true }
                    correlation_id: "order_id"
                    payload:
                      order_id: "order_id"
                - send:
                    event: reminder_requested
                    to: { external: true }
                    correlation_id: "order_id"
                    payload:
                      order_id: "order_id"
                      delay_seconds: "900"

        processing:
          type: parallel
          entry:
            - send:
                event: begin
                targets:
                  - { component: fulfillment }
                  - { component: accounting }
          on_events:
            finish_components:
              action:
                - send:
                    event: finish_component
                    targets:
                      - { component: fulfillment }
                      - { component: accounting }
            payment_succeeded:
              action:
                - assign: { payment_status: "'succeeded'" }
            payment_rejected:
              action:
                - assign: { payment_status: "'rejected'" }
            reminder_elapsed:
              action:
                - assign: { reminder_due: "true" }
            cancel_worker:
              action:
                - cancel: { instance: "payment_worker" }
            done:
              transition_to: complete
          components:
            - component_id: fulfillment
              machine_id: fulfillment
              with:
                input:
                  order_id: "owner.variables.order_id"
            - component_id: accounting
              root:
                type: composite
                variables:
                  order_id: { type: string, input: true }
                initial: { transition_to: waiting }
                states:
                  waiting:
                    on_events:
                      begin: { transition_to: active }
                  active:
                    on_events:
                      finish_component: { transition_to: complete }
                  complete: { type: final }
              with:
                input:
                  order_id: "owner.variables.order_id"

        complete:
          type: final

  - machine_id: fulfillment
    version: 1
    events:
      advance_fulfillment:
        direction: internal
      pause_fulfillment:
        direction: internal
      resume_fulfillment:
        direction: internal
      restart_fulfillment:
        direction: internal
      reenter_fulfillment:
        direction: internal
    root:
      type: composite
      variables:
        order_id: { type: string, input: true }
      initial: { transition_to: waiting }
      states:
        waiting:
          on_events:
            begin: { transition_to: active }
        active:
          type: composite
          history: deep
          initial: { transition_to: phase_one }
          on_events:
            pause_fulfillment: { transition_to: paused }
            finish_component: { transition_to: complete }
            reenter_fulfillment:
              transition_to: { history: active }
          states:
            phase_one:
              on_events:
                advance_fulfillment: { transition_to: phase_two }
            phase_two: {}
        paused:
          on_events:
            resume_fulfillment:
              transition_to: { history: active }
            restart_fulfillment:
              transition_to: active
        complete: { type: final }

  - machine_id: payment_worker
    version: 1
    events:
      retry:
        direction: internal
    root:
      type: composite
      variables:
        order_id: { type: string, input: true }
        provider_region: { type: string, external: true }
      initial: { transition_to: ready }
      states:
        ready: {}
