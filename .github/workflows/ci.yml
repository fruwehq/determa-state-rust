name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  SPECIFICATION_COMMIT: 4bd4d9588d11b75d376380b6120676a056a4bc45
  CONFORMANCE_COMMIT: fc4842010ab8d83bf4c5c6280a5627ca86829f7f

jobs:
  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

  build-test:
    name: build + format 1 core conformance + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          submodules: recursive

      - name: Check out the normative specification
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: fruwehq/determa-state-spec
          ref: ${{ env.SPECIFICATION_COMMIT }}
          path: authoritative-spec
          persist-credentials: false

      - name: Verify immutable inputs
        run: |
          test "$(git -C conformance-suite rev-parse HEAD)" = "$CONFORMANCE_COMMIT"
          test "$(git -C authoritative-spec rev-parse HEAD)" = "$SPECIFICATION_COMMIT"
          cmp schema/machine.schema.json authoritative-spec/schema/machine.schema.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release

      - name: Validate authoritative specification examples
        run: |
          cargo run --release --bin determa-state -- validate authoritative-spec/examples/minimal.yaml
          cargo run --release --bin determa-state -- validate authoritative-spec/examples/full.yaml

      - name: Unit and public API tests
        run: cargo test --lib --bins --test public_api

      - name: Documentation tests
        run: cargo test --doc

      - name: All 75 format 1 core conformance cases
        run: cargo test --test core_conformance -- --nocapture
