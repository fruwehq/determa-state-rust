name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  SPECIFICATION_COMMIT: 318ef1f16ae024770090bd338c8b70056df2855b
  CONFORMANCE_COMMIT: 86cb08a98267371b96b8f4908409aee022e4b4fe

jobs:
  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy --all-features --all-targets -- -D warnings

  build-test:
    name: build + format 1 core conformance + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Check out the normative specification
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: fruwehq/determa-state-spec
          ref: ${{ env.SPECIFICATION_COMMIT }}
          path: authoritative-spec
          persist-credentials: false

      - name: Verify immutable inputs
        run: |
          test "$(git -C conformance-suite rev-parse HEAD)" = "$CONFORMANCE_COMMIT"
          test "$(git -C authoritative-spec rev-parse HEAD)" = "$SPECIFICATION_COMMIT"
          cmp schema/machine.schema.json authoritative-spec/schema/machine.schema.json
          cmp schema/aggregate-state.schema.json authoritative-spec/schema/aggregate-state.schema.json
          cmp schema/migration-descriptor.schema.json authoritative-spec/schema/migration-descriptor.schema.json
          cmp schema/aggregate-state-package.schema.json authoritative-spec/schema/aggregate-state-package.schema.json
          cmp schema/execution-checkpoint.schema.json authoritative-spec/schema/execution-checkpoint.schema.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release

      - name: Validate authoritative specification examples
        run: |
          cargo run --release --bin determa-state -- validate authoritative-spec/examples/minimal.yaml
          cargo run --release --bin determa-state -- validate authoritative-spec/examples/full.yaml

      - name: Unit and public API tests
        run: cargo test --lib --bins --test public_api --test checkpoint_adapters

      - name: Documentation tests
        run: cargo test --doc

      - name: All 110 format 1 core conformance cases
        run: cargo test --test core_conformance --test persistence_conformance -- --nocapture

      - name: Persistence host profiles
        run: cargo test --test persistence_profiles -- --nocapture

      - name: All 85 execution-checkpoint host vectors
        run: cargo test --test checkpoint_conformance -- --nocapture

  postgresql:
    name: PostgreSQL execution-store integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: determa
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d determa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build with PostgreSQL
        run: cargo build --release --features postgresql

      - name: PostgreSQL transaction and CAS contract
        env:
          DETERMA_TEST_POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/determa
        run: cargo test --features postgresql --test checkpoint_postgresql -- --nocapture
