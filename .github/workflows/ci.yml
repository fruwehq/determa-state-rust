name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  PYTHONDONTWRITEBYTECODE: 1
  SPECIFICATION_COMMIT: 6207362e879ccca70f709e1eb4cc90448d910c0b
  CONFORMANCE_COMMIT: e499a99c3ced88f29008049ea9dddcc17a0d9f51

jobs:
  msrv:
    name: Rust 1.86 MSRV + locked feature surface
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable 2026-09-03
        with:
          toolchain: 1.86.0

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: msrv-1.86

      - name: Verify MSRV metadata and locked dependency graph
        run: |
          python3 scripts/verify_msrv.py --expected 1.86
          python3 scripts/test_release_metadata.py
          cargo metadata --locked --all-features --format-version 1 > /dev/null

      - name: Build default features
        run: cargo build --release --locked

      - name: Test default features
        run: cargo test --locked

      - name: Build and test all features, including PostgreSQL
        run: |
          cargo build --release --locked --all-features
          cargo test --locked --all-features

      - name: Test the generated crate without repository fixtures
        run: |
          test -z "$(git status --porcelain)"
          cargo package --locked
          package_dir="$(mktemp -d)"
          tar -xzf target/package/determa-state-0.3.0.crate -C "$package_dir"
          cd "$package_dir/determa-state-0.3.0"
          cargo test --locked
          cargo test --locked --all-features

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable 2026-09-03
        with:
          components: clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Clippy
        run: cargo clippy --locked --all-features --all-targets -- -D warnings

  build-test:
    name: build + format 1 core conformance + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Check out the normative specification
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: fruwehq/determa-state-spec
          ref: ${{ env.SPECIFICATION_COMMIT }}
          path: authoritative-spec
          persist-credentials: false

      - name: Verify immutable inputs
        run: |
          test "$(git -C conformance-suite rev-parse HEAD)" = "$CONFORMANCE_COMMIT"
          test "$(git -C authoritative-spec rev-parse HEAD)" = "$SPECIFICATION_COMMIT"
          cmp schema/machine.schema.json authoritative-spec/schema/machine.schema.json
          cmp schema/aggregate-state-v1.schema.json authoritative-spec/schema/aggregate-state-v1.schema.json
          cmp schema/aggregate-state-package-v1.schema.json authoritative-spec/schema/aggregate-state-package-v1.schema.json
          cmp schema/migration-descriptor-v1.schema.json authoritative-spec/schema/migration-descriptor-v1.schema.json
          cmp schema/core-step-result-v1.schema.json authoritative-spec/schema/core-step-result-v1.schema.json
          cmp schema/execution-checkpoint-v1.schema.json authoritative-spec/schema/execution-checkpoint-v1.schema.json
          cmp schema/provider-reference-v1.schema.json authoritative-spec/schema/provider-reference-v1.schema.json
          cmp schema/extension-descriptor-v1.schema.json authoritative-spec/schema/extension-descriptor-v1.schema.json
          cmp schema/extension-capability-report-v1.schema.json authoritative-spec/schema/extension-capability-report-v1.schema.json
          cmp schema/extension-capability-requirement-v1.schema.json authoritative-spec/schema/extension-capability-requirement-v1.schema.json
          cmp schema/durable-host-call-log-v1.schema.json conformance-suite/scripts/schemas/durable-host-call-log-v1.schema.json
          cmp schema/durable-host-inputs-v1.schema.json conformance-suite/scripts/schemas/durable-host-inputs-v1.schema.json
          cmp schema/durable-host-results-v1.schema.json conformance-suite/scripts/schemas/durable-host-results-v1.schema.json
          cmp schema/durable-host-responses-v1.schema.json conformance-suite/scripts/schemas/durable-host-responses-v1.schema.json
          cmp schema/durable-host-store-v1.schema.json conformance-suite/scripts/schemas/durable-host-store-v1.schema.json
          cmp schema/version1-operation-inputs.schema.json conformance-suite/scripts/schemas/version1-operation-inputs.schema.json
          cmp schema/version1-operation-result.schema.json conformance-suite/scripts/schemas/version1-operation-result.schema.json
          cmp schema/version1-operation-failures.schema.json conformance-suite/scripts/schemas/version1-operation-failures.schema.json

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable 2026-09-03

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Build
        run: cargo build --release --locked

      - name: Validate authoritative specification examples
        run: |
          cargo run --release --locked --bin determa-state -- validate authoritative-spec/examples/minimal.yaml
          cargo run --release --locked --bin determa-state -- validate authoritative-spec/examples/full.yaml

      - name: Unit and public API tests
        run: cargo test --locked --lib --bins --test public_api --test closed_code_registry --test checkpoint_adapters

      - name: Public extension negotiation vectors
        run: |
          cargo test --locked --test extension_conformance
          cargo build --locked --example extension_profile_adapter
          python3 conformance-suite/scripts/run_extension_negotiation_profile.py --spec-root authoritative-spec --adapter target/debug/examples/extension_profile_adapter

      - name: All 75 authoritative mailbox-neutral RTC scenarios
        env:
          RUSTFLAGS: --cfg determa_repository_conformance
        run: cargo test --locked --lib format1::runtime_conformance::all_75_format_1_runtime_scenarios -- --nocapture

      - name: Documentation tests
        run: cargo test --locked --doc

      - name: All 162 native artifact/checkpoint schema-v1 vectors
        run: cargo test --locked --test native_v1_conformance -- --nocapture

      - name: All 420 declared artifact documents
        run: cargo test --locked --test artifact_manifest -- --nocapture

      - name: All 142 durable-host vectors
        run: cargo test --locked --test durable_host_conformance -- --nocapture

  postgresql:
    name: PostgreSQL execution-store integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: determa
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d determa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable 2026-09-03

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Build with PostgreSQL
        run: cargo build --release --locked --features postgresql

      - name: PostgreSQL transaction and CAS contract
        env:
          DETERMA_TEST_POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/determa
        run: cargo test --locked --features postgresql --test checkpoint_postgresql -- --nocapture
