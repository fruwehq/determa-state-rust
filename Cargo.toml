[package]
name = "determa-state"
version = "0.3.0"
edition = "2021"
build = "build.rs"
rust-version = "1.86"
authors = ["fruwehq"]
license = "MIT"
description = "Determa State — Rust implementation of the Determa statechart engine (implements Determa State spec v0.3.0)"
repository = "https://github.com/fruwehq/determa-state-rust"
readme = "README.md"
exclude = [
    "authoritative-spec/",
    "conformance-suite/",
    "tests/artifact_manifest.rs",
    "tests/checkpoint_adapters.rs",
    "tests/durable_host_conformance.rs",
    "tests/inspection_conformance.rs",
    "tests/native_v1_conformance.rs",
    "tests/closed_code_registry.rs",
    "tests/checkpoint_postgresql.rs",
    "tests/extension_conformance.rs",
    "tests/public_host_protocol.rs",
    "examples/extension_profile_adapter.rs",
    "examples/adapter_policy_probe.rs",
    "src/format1/runtime_conformance.rs",
    ".github/",
]

[lib]
name = "determa_state"
path = "src/lib.rs"

[features]
default = ["sqlite"]
sqlite = ["dep:rusqlite"]
postgresql = ["dep:postgres"]

[[bin]]
name = "determa-state"
path = "src/bin/determa_state.rs"

# A language-suffixed alias so the launcher (and users) can pick a specific
# implementation when both are installed (DETERMA_STATE_IMPL=rust). Same binary.
[[bin]]
name = "determa-state-rust"
path = "src/bin/determa_state_rust.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_json_canonicalizer = "0.3"
cel-parser = "0.10"
fs2 = "0.4"
jsonschema = { version = "0.33", default-features = false }
num-bigint = { version = "0.4", features = ["serde"] }
postgres = { version = "0.19", optional = true }
regex = "1"
rusqlite = { version = "0.32", features = ["bundled"], optional = true }
ryu-js = "1"
sha2 = "0.10"
yaml-rust2 = "0.10"

[dev-dependencies]
serde_yaml = "0.9"

[profile.release]
opt-level = 2

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(determa_repository_conformance)'] }
