[package]
name = "determa-state"
version = "0.0.7"
edition = "2021"
authors = ["fruwehq"]
license = "MIT"
description = "Determa State — Rust implementation of the Determa statechart engine (implements Determa State spec v0.0.7)"
repository = "https://github.com/fruwehq/determa-state-rust"
readme = "README.md"
exclude = [
    "authoritative-spec/",
    "conformance-suite/",
    "tests/core_conformance.rs",
    ".github/",
]

[lib]
name = "determa_state"
path = "src/lib.rs"

[[bin]]
name = "determa-state"
path = "src/bin/determa_state.rs"

# A language-suffixed alias so the launcher (and users) can pick a specific
# implementation when both are installed (DETERMA_STATE_IMPL=rust). Same binary.
[[bin]]
name = "determa-state-rust"
path = "src/bin/determa_state_rust.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cel-parser = "0.10"
jsonschema = { version = "0.33", default-features = false }
num-bigint = { version = "0.4", features = ["serde"] }
regex = "1"
ryu-js = "1"
sha2 = "0.10"
yaml-rust2 = "0.10"

[dev-dependencies]
serde_yaml = "0.9"

[profile.release]
opt-level = 2
